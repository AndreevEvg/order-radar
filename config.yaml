# Интервал между проверками (в минутах). По умолчанию 3 часа.
interval_minutes: 180

# Ключевые слова для включения заказа (регистронезависимо).
include_keywords:
  - "golang"
  - "go developer"
  - "микросервис"
  - "backend api"
  - "rest"
  - "grpc"

# Ключевые слова-исключения: если встречаются — заказ отбрасывается.
exclude_keywords:
  - "1C"
  - "python"
  - "django"
  - "java"

# Учётные данные Kwork (обязательны для работы адаптера Kwork).
kwork:
  login: "ваш_логин"
  password: "ваш_пароль"
  phone_last: "0102" # последние 4 цифры телефона, если требуется
  proxy_url: "" # например, "socks5://user:pass@host:port"

# Настройки веб-сервера.
server:
  addr: ":8080"